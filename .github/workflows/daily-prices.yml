name: Daily PokeRoulette prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main]
    paths:
      - 'PokeRoulette_v275_Rarity_Enrichment_Setup.zip'
      - '.github/workflows/daily-prices.yml'
      - 'index.html'
      - '*.png'
      - '*.ico'
      - 'manifest.json'
      - 'CNAME'
      - 'data/artwork-manifest.json'
      - 'data/delta-reign-reference.json'
      - 'images/**'
      - 'assets/set-symbols/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pokeroulette-pages-and-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Open the v275 setup ZIP
        run: |
          unzip -oq PokeRoulette_v275_Rarity_Enrichment_Setup.zip -d _app
          if grep -q 'function loadSharedPrices' index.html; then
            cp index.html _app/index.html
          fi
          for asset in CNAME manifest.json *.png *.ico; do
            if [ -f "$asset" ]; then cp "$asset" _app/; fi
          done
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore saved prices
        uses: actions/cache/restore@v4
        with:
          path: |
            _app/data/prices-v1.json
            _app/.price-state/checkpoint.json
          key: shared-prices-v266-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            shared-prices-v266-
            shared-prices-v265-
            shared-prices-v264-
            shared-prices-v241-
      - name: Refresh early-set artwork catalogue
        working-directory: _app
        env:
          PREVIOUS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/update-new-sets.mjs --previous-url "$PREVIOUS_SITE_URL/data/new-sets-v1.json"
      - name: Refresh published product identities
        working-directory: _app
        run: |
          python3 scripts/build-product-map.py
          python3 scripts/build-audit-references.py
      - name: Build verified rarity catalogue
        working-directory: _app
        run: node scripts/build-rarity-map.mjs
      - name: Run checks
        working-directory: _app
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p "test_*.py"
      - name: Update prices
        working-directory: _app
        env:
          PREVIOUS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/update-prices.mjs --previous-url "$PREVIOUS_SITE_URL/data/prices-v1.json"
      - name: Upload price diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-diagnostics-v268
          path: _app/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save prices for next time
        if: always() && hashFiles('_app/.price-state/checkpoint.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            _app/data/prices-v1.json
            _app/.price-state/checkpoint.json
          key: shared-prices-v266-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate rarity catalogue
        working-directory: _app
        run: node --test tests/rarity-enrichment.test.mjs
      - name: Prepare app
        working-directory: _app
        run: node scripts/prepare-pages.mjs
      - name: Build verified local artwork manifest
        run: |
          if [ -f tools/build_artwork_manifest.py ]; then
            python3 tools/build_artwork_manifest.py
          fi
      - name: Include verified local card artwork and set symbols
        run: |
          # Preserve the existing prepared site and pricing data.
          mkdir -p _app/_site/data _app/_site/images
          if [ -f data/artwork-manifest.json ]; then
            cp data/artwork-manifest.json _app/_site/data/artwork-manifest.json
          fi
          if [ -d images ]; then
            cp -R images/. _app/_site/images/
          fi
          # Publish the local TCG set-symbol library alongside index.html.
          if [ -d assets/set-symbols ]; then
            mkdir -p _app/_site/assets/set-symbols
            cp -R assets/set-symbols/. _app/_site/assets/set-symbols/
            test "$(find _app/_site/assets/set-symbols -type f -name '*.png' | wc -l)" -ge 198
          else
            echo 'Missing assets/set-symbols directory' >&2
            exit 1
          fi
      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: _app/_site
      - name: Publish app and prices
        id: deployment
        uses: actions/deploy-pages@v4
