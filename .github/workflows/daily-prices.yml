name: Daily PokeRoulette prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main]
    paths:
      - 'PokeRoulette_v240_shared_daily_prices_setup.zip'
      - '.github/workflows/daily-prices.yml'
      - 'index.html'
      - '*.png'
      - '*.ico'
      - 'manifest.json'
      - 'CNAME'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pokeroulette-pages-and-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Open the setup ZIP
        run: |
          unzip -oq PokeRoulette_v240_shared_daily_prices_setup.zip -d _app
          if grep -q 'function loadSharedPrices' index.html; then
            cp index.html _app/index.html
          fi
          for asset in CNAME manifest.json *.png *.ico; do
            if [ -f "$asset" ]; then cp "$asset" _app/; fi
          done

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore saved prices
        uses: actions/cache/restore@v4
        with:
          path: |
            _app/data/prices-v1.json
            _app/.price-state/checkpoint.json
          key: shared-prices-v241-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shared-prices-v241-

      - name: Run checks
        working-directory: _app
        run: node --test tests/prices.test.mjs

      - name: Update prices
        working-directory: _app
        env:
          PREVIOUS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/update-prices.mjs --previous-url "$PREVIOUS_SITE_URL/data/prices-v1.json"

      - name: Save prices for next time
        if: always() && hashFiles('_app/.price-state/checkpoint.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            _app/data/prices-v1.json
            _app/.price-state/checkpoint.json
          key: shared-prices-v241-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare app
        working-directory: _app
        run: node scripts/prepare-pages.mjs

      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: _app/_site

      - name: Publish app and prices
        id: deployment
        uses: actions/deploy-pages@v4
